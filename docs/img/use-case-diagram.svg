<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#333333" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1100" height="800" fill="#ffffff"/>

  <!-- System boundary -->
  <rect x="150" y="44" width="820" height="740" fill="#f8fafc" stroke="#333333" stroke-width="2"/>
  <text x="165" y="70" font-size="15" font-weight="bold" fill="#1f3a68">Child Development Platform</text>

  <!-- Association lines: Parent -->
  <g stroke="#333333" stroke-width="1.3" fill="none">
    <path d="M70 396 V22 H570 V77"/>
    <line x1="92" y1="438" x2="165" y2="190"/>
    <line x1="92" y1="438" x2="165" y2="256"/>
    <line x1="92" y1="438" x2="165" y2="322"/>
    <line x1="92" y1="438" x2="165" y2="388"/>
    <line x1="92" y1="438" x2="165" y2="454"/>
    <line x1="92" y1="438" x2="165" y2="520"/>
    <line x1="92" y1="438" x2="165" y2="586"/>
    <line x1="92" y1="438" x2="165" y2="652"/>
    <line x1="92" y1="438" x2="165" y2="718"/>
  </g>

  <!-- Association lines: Administrator -->
  <g stroke="#333333" stroke-width="1.3" fill="none">
    <path d="M1030 396 V22 H610 V77"/>
    <line x1="1008" y1="438" x2="955" y2="388"/>
    <line x1="1008" y1="438" x2="955" y2="454"/>
    <line x1="1008" y1="438" x2="955" y2="520"/>
  </g>

  <!-- Extend relationships -->
  <g stroke="#333333" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)">
    <line x1="590" y1="166" x2="590" y2="125"/>
    <line x1="490" y1="256" x2="416" y2="256"/>
    <line x1="490" y1="586" x2="416" y2="586"/>
    <line x1="490" y1="718" x2="416" y2="718"/>
  </g>
  <g font-size="11" font-style="italic" fill="#333333">
    <text x="600" y="150" text-anchor="start">«extend»</text>
    <text x="453" y="249" text-anchor="middle">«extend»</text>
    <text x="453" y="579" text-anchor="middle">«extend»</text>
    <text x="453" y="711" text-anchor="middle">«extend»</text>
  </g>

  <!-- Use cases -->
  <g fill="#ffffff" stroke="#1f3a68" stroke-width="1.6">
    <!-- shared -->
    <ellipse cx="590" cy="100" rx="100" ry="24"/>
    <ellipse cx="590" cy="190" rx="100" ry="24"/>
    <!-- parent -->
    <ellipse cx="290" cy="190" rx="125" ry="24"/>
    <ellipse cx="290" cy="256" rx="125" ry="24"/>
    <ellipse cx="290" cy="322" rx="125" ry="24"/>
    <ellipse cx="290" cy="388" rx="125" ry="24"/>
    <ellipse cx="290" cy="454" rx="125" ry="24"/>
    <ellipse cx="290" cy="520" rx="125" ry="24"/>
    <ellipse cx="290" cy="586" rx="125" ry="24"/>
    <ellipse cx="290" cy="652" rx="125" ry="24"/>
    <ellipse cx="290" cy="718" rx="125" ry="24"/>
    <!-- extensions -->
    <ellipse cx="590" cy="256" rx="100" ry="24"/>
    <ellipse cx="590" cy="586" rx="100" ry="24"/>
    <ellipse cx="590" cy="718" rx="100" ry="24"/>
    <!-- admin -->
    <ellipse cx="850" cy="388" rx="105" ry="24"/>
    <ellipse cx="850" cy="454" rx="105" ry="24"/>
    <ellipse cx="850" cy="520" rx="105" ry="24"/>
  </g>

  <g text-anchor="middle" fill="#111111" font-size="13">
    <text x="590" y="105">Register and log in</text>
    <text x="590" y="195">Reset forgotten password</text>

    <text x="290" y="195">Manage child profiles</text>
    <text x="290" y="261">Record growth measurements</text>
    <text x="290" y="327">Track developmental milestones</text>
    <text x="290" y="393">View activity suggestions</text>
    <text x="290" y="459">Manage health records</text>
    <text x="290" y="525">Track vaccinations</text>
    <text x="290" y="591">Manage reminders</text>
    <text x="290" y="657">View dashboard</text>
    <text x="290" y="723">Generate child report</text>

    <text x="590" y="261">View growth percentiles</text>
    <text x="590" y="591">Receive email reminders</text>
    <text x="590" y="723">Export report as PDF</text>

    <text x="850" y="393">Manage milestone catalog</text>
    <text x="850" y="459">Manage activity catalog</text>
    <text x="850" y="525">View system statistics</text>
  </g>

  <!-- Actor: Parent / Caregiver -->
  <g stroke="#333333" stroke-width="2" fill="none">
    <circle cx="70" cy="410" r="14" fill="#ffffff"/>
    <line x1="70" y1="424" x2="70" y2="462"/>
    <line x1="48" y1="438" x2="92" y2="438"/>
    <line x1="70" y1="462" x2="52" y2="488"/>
    <line x1="70" y1="462" x2="88" y2="488"/>
  </g>
  <text text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">
    <tspan x="70" y="510">Parent /</tspan>
    <tspan x="70" y="526">Caregiver</tspan>
  </text>

  <!-- Actor: Administrator -->
  <g stroke="#333333" stroke-width="2" fill="none">
    <circle cx="1030" cy="410" r="14" fill="#ffffff"/>
    <line x1="1030" y1="424" x2="1030" y2="462"/>
    <line x1="1008" y1="438" x2="1052" y2="438"/>
    <line x1="1030" y1="462" x2="1012" y2="488"/>
    <line x1="1030" y1="462" x2="1048" y2="488"/>
  </g>
  <text x="1030" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Administrator</text>

  <!-- Legend -->
  <text x="165" y="772" font-size="11" fill="#555555">Solid lines: associations. Dashed arrows: «extend» relationships (the arrow points to the base use case).</text>
</svg>
