
name: CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Node.js version
        run: node --version

      - name: Check npm version
        run: npm --version

      - name: CI initialization
        run: echo "CI pipeline initialized successfully"
